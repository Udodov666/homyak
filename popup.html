<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --panel: #111615;
      --component: #1e2725;
      --text: rgba(255, 255, 255, .87);
      --text2: rgba(255, 255, 255, .61);
      --text3: rgba(255, 255, 255, .49);
      --accent: #2bad72;
      --accent-hover: #3cc986;
      --red: #d98a8a;
    }
    html { background: transparent; }
    body {
      width: 300px;
      margin: 0;
      padding: 18px;
      border-radius: 18px;
      overflow: hidden;
      background: var(--panel);
      color: var(--text);
      box-sizing: border-box;
      font-family: 'Inter Variable', 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }
    .head { font-size: 14px; font-weight: 700; margin-bottom: 14px; }
    .label { display: block; font-size: 11.5px; color: var(--text3); margin-bottom: 6px; }
    #key {
      width: 100%;
      box-sizing: border-box;
      height: 36px;
      padding: 0 12px;
      border: none;
      border-radius: 12px;
      background: #0c0f0e;
      color: var(--text);
      font-size: 12px;
      font-family: 'SFMono-Regular', Consolas, monospace;
      outline: none;
      transition: box-shadow .12s ease;
    }
    #key:focus { box-shadow: 0 0 0 2px var(--accent); }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn {
      flex: 1;
      height: 32px;
      border: none;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background .12s ease, color .12s ease;
    }
    .btn:active { transform: scale(.98); }
    .btn.primary { background: var(--accent); color: #080808; }
    .btn.primary:hover { background: var(--accent-hover); }
    .btn.ghost { background: var(--component); color: var(--text2); }
    .btn.ghost:hover { background: #232e2b; color: var(--text); }
    .btn:disabled { opacity: .5; cursor: default; }
    .status { margin-top: 12px; font-size: 12px; color: var(--text2); }
    .status.ok { color: var(--accent); }
    .status.err { color: var(--red); }
    .footer {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      font-size: 11.5px;
      color: var(--text3);
      text-decoration: none;
      transition: color .12s ease;
    }
    .footer img { border-radius: 100px; }
    .footer b { color: var(--text2); font-weight: 600; }
    .footer:hover b { color: var(--accent); }
  </style>
</head>
<body>
  <div class="head">Хомобот</div>

  <label class="label" for="key">API-ключ FastAIToken</label>
  <input type="password" id="key" placeholder="sk-..." autocomplete="off" spellcheck="false">

  <div class="actions">
    <button id="save" class="btn primary">Сохранить</button>
    <button id="balance" class="btn ghost">Проверить баланс</button>
  </div>

  <div id="status" class="status" hidden></div>

  <a class="footer" href="https://lolz.team/members/638074/" target="_blank" rel="noopener">
    <span>Проект запустил</span>
    <img src="https://nztcdn.com/avatar/l/1782902205/638074.webp" alt="" width="16" height="16">
    <b>Udodov</b>
  </a>

  <script src="popup.js"></script>
</body>
</html>
